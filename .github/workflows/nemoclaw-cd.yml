name: Nemoclaw CD

on:
  workflow_run:
    workflows: ["Nemoclaw CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-nemoclaw
  cancel-in-progress: false

jobs:
  validate-gate:
    name: Validate CI Gate
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Acknowledge Green CI
        run: echo "CI metrics clear. Promoting NemoClaw to Production VPS."

  deploy-nemoclaw:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: validate-gate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre-Transfer Cleanup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/nemoclaw
            rm -rf /opt/nemoclaw/* || true
            chown -R $(whoami):$(whoami) /opt/nemoclaw

      - name: Deploy to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/opt/nemoclaw"
          rm: false # Handled by Pre-Transfer Cleanup

      - name: Hot-Swap via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 5m
          script: |
            cd /opt/nemoclaw
            docker network create traefik-net || true
            docker compose pull || true
            docker compose up -d --remove-orphans
            docker image prune -a -f --filter "until=24h"
            echo "NemoClaw Deployment Verified"
