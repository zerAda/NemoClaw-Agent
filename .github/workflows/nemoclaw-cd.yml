name: Nemoclaw CD

on:
  workflow_run:
    workflows: ["Nemoclaw CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-nemoclaw
  cancel-in-progress: false

jobs:
  validate-gate:
    name: Validate CI Gate
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Acknowledge Green CI
        run: echo "CI metrics clear. Promoting NemoClaw to Production VPS."

  deploy-nemoclaw:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: validate-gate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre-Transfer Cleanup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/nemoclaw
            cp /opt/nemoclaw/.env /tmp/nemoclaw-env-backup 2>/dev/null || true
            rm -rf /opt/nemoclaw/* || true

      - name: Transfer Files
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/opt/nemoclaw"

      - name: Hot-Swap via SSH
        env:
          NEMO_API_KEY: ${{ secrets.NEMO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        uses: appleboy/ssh-action@master
        with:
          envs: NEMO_API_KEY,TELEGRAM_BOT_TOKEN
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/nemoclaw
            [ -f /tmp/nemoclaw-env-backup ] && cp /tmp/nemoclaw-env-backup .env || touch .env
            
            # Inject/Update Secrets
            grep -q "NEMO_API_KEY" .env && sed -i "s/^NEMO_API_KEY=.*/NEMO_API_KEY=${NEMO_API_KEY}/" .env || echo "NEMO_API_KEY=${NEMO_API_KEY}" >> .env
            grep -q "TELEGRAM_BOT_TOKEN" .env && sed -i "s/^TELEGRAM_BOT_TOKEN=.*/TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}/" .env || echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}" >> .env
            
            # Start/Restart Services
            docker-compose down || true
            docker-compose up -d --build
            
            # Verify Status
            sleep 15
            docker ps
            docker exec openclaw env | grep -E "(MODEL|BASE_URL|GEMINI|TELEGRAM|NEMO|SKILLS)" || echo "WARNING: Env mismatch"

      - name: Final Verification
        run: |
          sleep 5
          # Use VPS Host for Health Checks
          curl -H "Authorization: Bearer ${{ secrets.NEMO_API_KEY }}" -sf http://${{ vars.VPS_HOST }}:8082/health && echo " ✓ sidecar healthy" || echo "WARNING: Sidecar health check failed"
          curl -H "Authorization: Bearer ${{ secrets.NEMO_API_KEY }}" -sf http://${{ vars.VPS_HOST }}:8001/health && echo " ✓ career-agent healthy" || echo "WARNING: career-agent health check failed"
