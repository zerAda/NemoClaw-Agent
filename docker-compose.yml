services:
  nemoclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    environment:
      # === AI Model Configuration ===
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GEMINI_API_KEY}
      - MODEL_ID=gemini-2.5-flash
      - BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai
      # === Telegram Gateway ===
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # === OpenClaw Core ===
      - NEMO_ROUTING_MODE=cloud
      - NEMO_EXEMPT_SANDBOX=true
      - NEMO_AUTH_USER_ID=${NEMO_AUTH_USER_ID}
      - NEMO_PAIRING_CODE=${NEMO_PAIRING_CODE}
      # === Advanced: Logging & Debugging ===
      - LOG_LEVEL=INFO
      - OPENCLAW_LOG_LEVEL=info
      # === Advanced: Agent Identity ===
      - OPENCLAW_AGENT_IDENTITY=/app/agent.md
      # === Advanced: Workspace & Memory ===
      - OPENCLAW_WORKSPACE=/app/workspace
      # === Skills Path ===
      - OPENCLAW_SKILLS_PATH=/app/skills
    volumes:
      # Persistent workspace — survives container restarts
      - openclaw-workspace:/app/workspace
      # Persistent brain/memory — application history & learning
      - ./brain:/app/brain
      # Agent identity file
      - ./agent.md:/app/agent.md:ro
      # Skills definitions (read-only)
      - ./skills:/app/skills:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nemoclaw.rule=Host(`nemoclaw.resto-bot.com`)"
      - "traefik.http.routers.nemoclaw.entrypoints=websecure"
      - "traefik.http.routers.nemoclaw.tls.certresolver=letsencrypt"
      - "traefik.http.services.nemoclaw.loadbalancer.server.port=8080"

  career-agent:
    build: ./career_agent
    container_name: career-agent
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${NEMO_AUTH_USER_ID}
      - BRAIN_PATH=/app/brain
      - LOG_LEVEL=INFO
    volumes:
      - ./brain:/app/brain
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  openclaw-workspace:

networks:
  traefik-net:
    external: true
