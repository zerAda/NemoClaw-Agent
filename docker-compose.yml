services:
  nemoclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    environment:
      # === AI Model (Google Gemini — native provider format) ===
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GEMINI_API_KEY}
      - MODEL_ID=google/gemini-2.5-flash
      # === Telegram Gateway ===
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # === Agent Identity ===
      - OPENCLAW_AGENT_IDENTITY=/app/agent.md
      - OPENCLAW_WORKSPACE=/app/workspace
      - OPENCLAW_SKILLS_PATH=/app/skills
      # === Logging ===
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OPENCLAW_LOG_LEVEL=${OPENCLAW_LOG_LEVEL:-info}
    volumes:
      - openclaw-workspace:/app/workspace
      - ./brain:/app/brain
      - ./agent.md:/app/agent.md:ro
      - ./skills:/app/skills:ro
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nemoclaw.rule=Host(`nemoclaw.resto-bot.com`)"
      - "traefik.http.routers.nemoclaw.entrypoints=websecure"
      - "traefik.http.routers.nemoclaw.tls.certresolver=letsencrypt"
      - "traefik.http.services.nemoclaw.loadbalancer.server.port=8080"

  career-agent:
    build: ./career_agent
    container_name: career-agent
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BRAIN_PATH=/app/brain
      - MODEL_ID=gemini-1.5-flash
      - LOG_LEVEL=INFO
    volumes:
      - ./brain:/app/brain
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  openclaw-workspace:

networks:
  traefik-net:
    external: true
